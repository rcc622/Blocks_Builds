name: Sync inventario y modelos

# Corre cuando cambian las fuentes (links de Brickit, piezas manuales, modelos, scripts), cuando la app manda un
# link nuevo (boton "Actualizar inventario" -> repository_dispatch), a mano desde Actions, o cada domingo.
on:
  push:
    branches: [main]
    paths:
      - "data/sources/brickit_links.txt"
      - "data/manual_parts.csv"
      - "data/corrections.csv"
      - "scripts/**"
      - "app/colors.js"
      - "app/check.js"
      - "builds/**/model.txt"
      - "builds/**/model.ldr"
      - "builds/**/meta.json"
  repository_dispatch:
    types: [brickit-link, corrections]   # corrections: piezas mal identificadas, desde el boton "Corregir" de la app
  issues:
    types: [opened]   # "[sync] ..." con el link en el cuerpo: lo abre la app cuando ese navegador no tiene token
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 0"

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '[sync]') || startsWith(github.event.issue.title, '[correcciones]')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ldraw
          key: ldraw-${{ hashFiles('builds/**/model.txt', 'builds/**/model.ldr', 'data/inventory.json') }}
          restore-keys: ldraw-
      - name: Importar inventario de Brickit
        env:
          # Llegan del boton de la app. Se pasan por env (no se pegan en el script) y el import valida el formato.
          LINK_URL: ${{ github.event.client_payload.url }}
          LINK_MODE: ${{ github.event.client_payload.mode }}
          FIX_LINES: ${{ github.event.client_payload.lines }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Correcciones de piezas: se guardan en data/corrections.csv y se reimporta el mismo link.
          case "$ISSUE_TITLE" in "[correcciones]"*) FIX_LINES="$ISSUE_BODY" ;; esac
          if [ -n "$FIX_LINES" ]; then
            CORRECTIONS="$FIX_LINES" node scripts/brickit_import.mjs --add-corrections
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            LINK_URL=$(printf '%s' "$ISSUE_BODY" | grep -oE 'https://brickit\.app/offer/[0-9a-f-]{36}' | head -1)
            case "$ISSUE_BODY" in *"modo: pocket"*) LINK_MODE=add ;; *) LINK_MODE=replace ;; esac
          fi
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            if [ "$LINK_MODE" = "add" ]; then node scripts/brickit_import.mjs --add "$LINK_URL"
            else node scripts/brickit_import.mjs --replace "$LINK_URL"; fi
          else
            node scripts/brickit_import.mjs
          fi
      - name: Catalogo de piezas y modelos
        run: |
          node scripts/check.test.mjs
          export LDRAW_CACHE="$HOME/.cache/ldraw"
          node scripts/build_models.mjs --catalog
          node scripts/build_models.mjs
      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ builds/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "data: sync inventario y modelos $(date -u +%Y-%m-%d)"
          # Si alguien subio algo mientras corria, se pone encima en vez de fallar el push (ya paso una vez).
          ok=0; for i in 1 2 3; do git pull --rebase -q origin main && git push -q && { ok=1; break; }; sleep 5; done; [ "$ok" = 1 ]
      - name: Cerrar el pedido
        # Pedido hecho desde la app sin token: un issue de GitHub. Se cierra con el resultado.
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          STATUS: ${{ job.status }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then MSG="Listo: inventario actualizado. La app lo muestra en 1 o 2 minutos."; else MSG="No se pudo completar. Detalle: $RUN"; fi
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$MSG"
