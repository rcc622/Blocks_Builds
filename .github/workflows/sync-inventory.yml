name: Sync inventario Brickit

# Se dispara cuando cambian las fuentes (links de Brickit o piezas manuales),
# a mano desde la pestaña Actions, o cada domingo por si un link cambio.
on:
  push:
    paths:
      - "data/sources/brickit_links.txt"
      - "data/manual_parts.csv"
      - "scripts/brickit_import.mjs"
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Importar inventario
        run: node scripts/brickit_import.mjs
      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "data: sync inventario Brickit $(date -u +%Y-%m-%d)"
          git push
