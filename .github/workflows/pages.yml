name: Publicar app

# Publica el sitio en GitHub Pages en cada push a main y despues de cada sync (los commits del bot no disparan push).
# Requiere una vez: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Sync inventario y modelos"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
